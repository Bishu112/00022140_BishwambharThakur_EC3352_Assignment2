<!DOCTYPE html>
<html lang="en">
<head>

</head>
<body class="store-page">
  <header class="site-header"><div class="site-header-inner">
    <a class="brand" href="index.html">Redline Royale</a>
    <nav class="main-nav" aria-label="Primary">
      <a href="shop.html">New In</a><a href="shop.html">Clothing</a><a href="shop.html">Shoes</a><a href="shop.html">Accessories</a>
    </nav>
    <form class="header-search" role="search" action="shop.html">
      <label class="sr-only" for="header-search">Search products</label>
      <input id="header-search" name="q" type="text" placeholder="Search products" autocomplete="off">
    </form>
    <div class="header-account"><a class="header-link" href="signin.html">Sign in</a> <a class="header-link" href="vendor-signup.html">Become a Vendor</a></div>
  </header>

  <main class="store-main">
    <div class="page-head">
      <p class="eyebrow">REGISTER</p>
      <h1 class="page-title">Create your account</h1>
    </div>

    <section class="auth-card" aria-labelledby="signup-title">
      <p class="auth-logo">Redline Royale</p>
      <h2 class="auth-title" id="signup-title">Join Redline Royale</h2>
            
      <form method="post" action="signup.html">
        <input type="hidden" name="csrf_token" value="26a8f803c2d0672594701e30c8dac25ffc49050ca2c71869039812117953f43b">        <div class="auth-field">
          <label for="su-name">Full name</label>
          <input class="input" id="su-name" name="name" type="text" value="" required>
        </div>
        <div class="auth-field">
          <label for="su-email">Email address</label>
          <input class="input" id="su-email" name="email" type="email" value="" required>
        </div>
        <div class="auth-field">
          <label for="su-password">Password</label>
          <input class="input" id="su-password" name="password" type="password" required>
        </div>
        <div class="auth-field">
          <label for="su-phone">Phone</label>
          <input class="input" id="su-phone" name="phone" type="tel" value="">
        </div>
        <div class="auth-field">
          <label for="su-address">Delivery address</label>
          <input class="input" id="su-address" name="address" type="text" value="">
        </div>
        <button class="btn btn-block btn-lg" type="submit">Create account</button>
      </form>

      <p class="auth-alt"><a href="signin.html">Already registered? Sign in</a></p>
      <p class="auth-vendor">Selling on Redline Royale? <a href="vendor-signup.html">Become a Vendor</a></p>
    </section>
  </main>

  <footer class="site-footer"><p class="footer-note">Fictitious business — created as part of a university coursework.</p></footer>
  <script src="js/app.js"></script>
